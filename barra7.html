<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barra y Paneles Alineados para xat.com</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: system-ui, Arial, sans-serif;
            background-color: transparent; /* Permite ver el fondo original de xat */
            color: #ffffff;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        #xat-app-container {
            width: 100%;
            /* El ancho exacto calculado: 215(izq) + 12(gap) + 726(chat) + 12(gap) + 215(der) = 1180px */
            max-width: 1180px; 
            margin: 60px auto 10px auto; /* top: 60px exacto según tu referencia */
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: relative;
            z-index: 100;
            box-sizing: border-box;
            pointer-events: none; /* Permite clics a través del contenedor vacío */
        }

        /* Permitir clics en los elementos interactivos hijos */
        #xat-app-container * {
            pointer-events: auto;
        }

        /* --- BARRA SUPERIOR SÚPER DELGADA, ELEGANTE Y ALARGADA --- */
        .top-toolbar {
            background-color: rgba(26, 34, 53, 0.95);
            border: 1px solid #2a3553;
            border-radius: 8px;
            padding: 4px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            flex-wrap: wrap;
            gap: 8px;
            width: 100%;
            box-sizing: border-box;
            backdrop-filter: blur(5px);
        }

        .toolbar-left {
            display: flex;
            align-items: center;
            background-color: #0b1021;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #2a3553;
        }

        .toolbar-btn {
            background: transparent;
            color: #8b9bb4;
            border: none;
            padding: 3px 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .toolbar-btn:hover { color: #ffffff; background-color: rgba(255, 255, 255, 0.05); }
        .toolbar-btn.active { background-color: #1db954; color: white; border-radius: 12px; }

        /* MINI REPRODUCTOR CENTRAL COMPACTO */
        .toolbar-player-center {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: #0b1021;
            padding: 2px 10px;
            border-radius: 12px;
            border: 1px solid #2a3553;
        }

        .mini-thumb {
            width: 22px;
            height: 22px;
            border-radius: 4px;
            object-fit: cover;
            border: 1px solid #2a3553;
        }

        .mini-info {
            display: flex;
            flex-direction: column;
            max-width: 110px;
        }

        .mini-title {
            font-size: 10px;
            font-weight: bold;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .mini-artist {
            font-size: 8px;
            color: #8b9bb4;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .toolbar-center-controls {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: 2px;
        }

        .bar-control-btn {
            background: none;
            border: none;
            color: #8b9bb4;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
            outline: none;
        }
        .bar-control-btn:hover { color: white; transform: scale(1.1); }
        .bar-play-btn { color: #1db954; font-size: 15px; }
        .bar-play-btn:hover { color: #1ed760; }

        /* CONTROL DE VOLUMEN */
        .volume-container {
            position: relative;
            display: flex;
            align-items: center;
            gap: 6px;
            background-color: #0b1021;
            border: 1px solid #2a3553;
            border-radius: 12px;
            padding: 3px 10px;
        }

        .volume-slider {
            width: 70px;
            height: 3px;
            -webkit-appearance: none;
            background: #2a3553;
            border-radius: 2px;
            outline: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #1db954;
            cursor: pointer;
        }

        /* --- FILA DE PANELES LATERALES ALINEADOS CON LOS EXTREMOS DE LA BARRA --- */
        .panels-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            width: 100%;
        }

        /* PANEL IZQUIERDO: ANCHO EXACTO AL BORDE IZQUIERDO DE LA BARRA (215px) */
        .side-panel-left {
            width: 215px;
            background-color: rgba(26, 34, 53, 0.95);
            border: 1px solid #2a3553;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
            flex-shrink: 0;
            box-sizing: border-box;
            backdrop-filter: blur(5px);
            margin-left: 0;
        }

        .player-img {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 6px;
            object-fit: cover;
            margin-bottom: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            border: 1px solid #0b1021;
        }

        .player-info { text-align: center; margin-bottom: 8px; width: 100%; }
        .player-title { color: #ffffff; font-size: 12px; font-weight: bold; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .player-artist { color: #8b9bb4; font-size: 10px; }

        /* ESPACIO CENTRAL VACÍO QUE CALCULA EXACTAMENTE LOS 726px DE LA CAJA DE XAT */
        .chat-space-spacer {
            width: 726px;
            height: 486px;
            flex-shrink: 0;
            pointer-events: none;
        }

        /* PANEL DERECHO: MISMA MEDIDA EXACTA (215px) Y DISEÑO IDÉNTICO AL IZQUIERDO */
        .side-panel-right {
            width: 215px;
            background-color: rgba(26, 34, 53, 0.95);
            border: 1px solid #2a3553;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
            flex-shrink: 0;
            overflow: hidden;
            max-height: 290px;
            box-sizing: border-box;
            backdrop-filter: blur(5px);
            margin-right: 0;
        }

        .playlist-header {
            padding: 8px 10px;
            border-bottom: 1px solid #2a3553;
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: #0b1021;
        }

        .playlist-header-img { width: 26px; height: 26px; border-radius: 4px; object-fit: cover; }

        .song-list-container {
            flex-grow: 1;
            overflow-y: auto;
        }
        
        .song-list-container::-webkit-scrollbar { width: 3px; }
        .song-list-container::-webkit-scrollbar-track { background: #1a2235; }
        .song-list-container::-webkit-scrollbar-thumb { background: #2a3553; border-radius: 4px; }

        .song-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 10px;
            border-bottom: 1px solid rgba(42, 53, 83, 0.2);
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .song-item:hover { background-color: #2a3553; }
        .song-item:hover .song-number { display: none; }
        .song-item:hover .play-icon-hover { display: block; }
        
        .song-number-container { width: 14px; text-align: center; display: flex; justify-content: center; align-items: center; }
        .play-icon-hover { display: none; color: #ffffff; }

        .active-song-text { color: #1db954 !important; }

        @keyframes pulse-shadow {
            0% { box-shadow: 0 0 6px rgba(29, 185, 84, 0.2); }
            50% { box-shadow: 0 0 12px rgba(29, 185, 84, 0.5); }
            100% { box-shadow: 0 0 6px rgba(29, 185, 84, 0.2); }
        }
        .playing-shadow {
            animation: pulse-shadow 2s infinite;
            border-color: #1db954;
        }
    </style>
</head>
<body>

    <div id="xat-app-container">
        
        <!-- BARRA SUPERIOR CON CONTROLES Y VOLUMEN -->
        <div class="top-toolbar">
            <!-- Géneros musicales -->
            <div class="toolbar-left">
                <button class="toolbar-btn active" id="btn-electronica" onclick="loadGenre('electronica')">
                    <i class="fas fa-headphones"></i> <span class="hidden sm:inline">Electrónica</span>
                </button>
                <button class="toolbar-btn" id="btn-pop" onclick="loadGenre('pop')">
                    <i class="fas fa-microphone"></i> <span class="hidden sm:inline">Pop</span>
                </button>
                <button class="toolbar-btn" id="btn-rock" onclick="loadGenre('rock')">
                    <i class="fas fa-guitar"></i> <span class="hidden sm:inline">Rock</span>
                </button>
            </div>

            <!-- Mini reproductor central con miniatura -->
            <div class="toolbar-player-center">
                <img src="" id="mini-thumb" class="mini-thumb" alt="Miniatura">
                <div class="mini-info">
                    <div id="mini-title" class="mini-title">Cargando...</div>
                    <div id="mini-artist" class="mini-artist">Artista</div>
                </div>
                <div class="toolbar-center-controls">
                    <button class="bar-control-btn" title="Anterior" onclick="playPrevious()">
                        <i class="fas fa-step-backward"></i>
                    </button>
                    <button class="bar-control-btn bar-play-btn" title="Reproducir/Pausar" onclick="togglePlay()">
                        <i class="fas fa-play-circle" id="bar-play-icon"></i>
                    </button>
                    <button class="bar-control-btn" title="Siguiente" onclick="playNext()">
                        <i class="fas fa-step-forward"></i>
                    </button>
                </div>
            </div>

            <!-- Control de Volumen -->
            <div class="volume-container">
                <button class="bar-control-btn" onclick="toggleMute()" title="Silenciar/Activar">
                    <i class="fas fa-volume-up" id="volume-icon"></i>
                </button>
                <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.05" value="0.7" oninput="changeVolume(this.value)">
            </div>
        </div>

        <!-- FILA DE PANELES LATERALES ALINEADOS EXACTAMENTE CON LOS BORDES DE LA BARRA -->
        <div class="panels-row">
            
            <!-- PANEL IZQUIERDO: REPRODUCTOR REDUCIDO -->
            <div class="side-panel-left">
                <img src="" id="player-img" class="player-img" alt="Portada">
                
                <div class="player-info">
                    <div id="player-title" class="player-title">Selecciona pista</div>
                    <div id="player-artist" class="player-artist">Playlist activa</div>
                </div>
            </div>

            <!-- ESPACIO CENTRAL VACÍO QUE RESPETA EXACTAMENTE LOS 726px DE LA CAJA DE XAT -->
            <div class="chat-space-spacer"></div>

            <!-- PANEL DERECHO: PLAYLIST (PROPORCIÓN IDÉNTICA DE 215px AL IZQUIERDO) -->
            <div class="side-panel-right">
                <div class="playlist-header">
                    <img src="" id="playlist-header-img" class="playlist-header-img">
                    <div>
                        <div class="text-white font-bold text-[10px]" id="playlist-header-title">Reproductor</div>
                        <div class="text-[#8b9bb4] text-[8px]">Haz clic para reproducir</div>
                    </div>
                </div>
                <div id="song-list" class="song-list-container"></div>
            </div>

        </div>
    </div>

    <script>
        const musicData = {
            electronica: {
                name: "Electrónica",
                icon: "fas fa-headphones",
                image: "https://xatimg.com/image/t7JMadg8NbqD.jpg", 
                songs: [
                    { title: "Neon Skyline", artist: "DJ Cyber", time: "3:45", bpm: 130, synth: "square", sequence: ["C4", "E4", "G4", "C5"] },
                    { title: "Bass Resonance", artist: "DropX", time: "4:12", bpm: 128, synth: "sawtooth", sequence: ["D2", "D2", "F2", "A2"] },
                    { title: "Galactic Voyage", artist: "AstroBeats", time: "5:01", bpm: 140, synth: "square", sequence: ["E4", "B4", "E5", "B4"] }
                ]
            },
            pop: {
                name: "Pop Hits",
                icon: "fas fa-microphone",
                image: "https://placehold.co/400x400/e1306c/ffffff?text=Pop+Hits", 
                songs: [
                    { title: "Midnight Dance", artist: "Luna Star", time: "2:55", bpm: 110, synth: "triangle", sequence: ["C4", "G4", "A4", "G4"] },
                    { title: "Catching Feelings", artist: "The Vibes", time: "3:10", bpm: 105, synth: "sine", sequence: ["F4", "A4", "C5", "A4"] }
                ]
            },
            rock: {
                name: "Rock Alternativo",
                icon: "fas fa-guitar",
                image: "https://placehold.co/400x400/222222/ffffff?text=Rock+Zone", 
                songs: [
                    { title: "Steel Strings", artist: "The Amplifiers", time: "5:20", bpm: 100, synth: "sawtooth", sequence: ["E2", null, "E2", "G2"] },
                    { title: "Rebel Yell", artist: "Thunderstrike", time: "4:40", bpm: 110, synth: "sawtooth", sequence: ["A2", "C3", "A2", "G2"] }
                ]
            }
        };

        let currentGenre = 'electronica';
        let currentSongIndex = 0;
        let currentLoopIndex = -1;
        let isPlaying = false;
        let synth = null;
        let loop = null;
        let previousVolume = 0.7;

        window.onload = () => {
            loadGenre('electronica');
        };

        function initAudio() {
            if (!synth) {
                synth = new Tone.PolySynth(Tone.Synth).toDestination();
                synth.volume.value = Tone.gainToDb(0.7);
            }
        }

        function loadGenre(genreId) {
            if (isPlaying) {
                Tone.Transport.stop();
                isPlaying = false;
            }
            currentLoopIndex = -1; 
            currentGenre = genreId;
            const data = musicData[genreId];

            document.querySelectorAll('.toolbar-left .toolbar-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${genreId}`).classList.add('active');

            document.getElementById('playlist-header-title').innerHTML = `<i class="${data.icon} mr-1"></i>${data.name}`;
            document.getElementById('playlist-header-img').src = data.image;

            selectSong(0); 
            updatePlayUI();
        }

        function selectSong(index) {
            currentSongIndex = index;
            const data = musicData[currentGenre];
            const song = data.songs[index];
            
            document.getElementById('player-title').textContent = song.title;
            document.getElementById('player-artist').textContent = song.artist;
            document.getElementById('player-img').src = data.image;

            document.getElementById('mini-title').textContent = song.title;
            document.getElementById('mini-artist').textContent = song.artist;
            document.getElementById('mini-thumb').src = data.image;

            renderSongList();
        }

        function renderSongList() {
            const data = musicData[currentGenre];
            const songListContainer = document.getElementById('song-list');
            songListContainer.innerHTML = ''; 

            data.songs.forEach((song, index) => {
                const isSelected = (index === currentSongIndex);
                const titleColor = isSelected ? 'active-song-text' : 'text-white';
                
                const songHtml = `
                    <div class="song-item group" onclick="selectAndPlaySong(${index})">
                        <div class="flex items-center gap-2">
                            <div class="song-number-container">
                                <span class="${isSelected ? 'hidden' : 'inline'} text-[#8b9bb4] text-[9px] song-number">${index + 1}</span>
                                <i class="fas ${isSelected && isPlaying ? 'fa-pause' : 'fa-play'} text-[#1db954] text-[7px] ${isSelected ? 'inline' : 'play-icon-hover'}"></i>
                            </div>
                            <div class="flex flex-col">
                                <span class="${titleColor} text-[10px] font-medium transition-colors">${song.title}</span>
                                <span class="text-[#8b9bb4] text-[8px] transition-colors">${song.artist}</span>
                            </div>
                        </div>
                        <span class="text-[#8b9bb4] text-[8px]">${song.time}</span>
                    </div>
                `;
                songListContainer.innerHTML += songHtml;
            });
        }

        async function togglePlay() {
            await Tone.start(); 
            initAudio();

            if (isPlaying) {
                Tone.Transport.pause();
                isPlaying = false;
            } else {
                startPlayingSelected();
            }
            updatePlayUI();
        }
        
        function startPlayingSelected() {
            const data = musicData[currentGenre];
            const song = data.songs[currentSongIndex];

            if (currentLoopIndex !== currentSongIndex || !loop) {
                if (loop) {
                    loop.stop();
                    loop.dispose();
                }
                synth.set({ oscillator: { type: song.synth } });
                Tone.Transport.bpm.value = song.bpm;
                Tone.Transport.stop(); 
                
                loop = new Tone.Sequence((time, note) => {
                    if (note) synth.triggerAttackRelease(note, "8n", time);
                }, song.sequence, "4n");
                
                loop.start(0);
                currentLoopIndex = currentSongIndex;
            }
            
            Tone.Transport.start();
            isPlaying = true;
        }

        async function selectAndPlaySong(index) {
            await Tone.start();
            initAudio();

            if (index === currentSongIndex) {
                togglePlay();
                return;
            }
            selectSong(index);
            startPlayingSelected();
            updatePlayUI();
        }

        function playNext() {
            if (isPlaying) { Tone.Transport.pause(); isPlaying = false; }
            
            const data = musicData[currentGenre];
            let nextIndex = currentSongIndex + 1;
            if (nextIndex >= data.songs.length) nextIndex = 0; 
            
            selectSong(nextIndex); 
            updatePlayUI(); 
        }

        function playPrevious() {
            if (isPlaying) { Tone.Transport.pause(); isPlaying = false; }
            
            const data = musicData[currentGenre];
            let prevIndex = currentSongIndex - 1;
            if (prevIndex < 0) prevIndex = data.songs.length - 1; 
            
            selectSong(prevIndex); 
            updatePlayUI(); 
        }

        function updatePlayUI() {
            const iconClass = isPlaying ? 'fa-pause-circle' : 'fa-play-circle';
            document.getElementById('bar-play-icon').className = `fas ${iconClass}`;
            
            const playerImg = document.getElementById('player-img');
            const miniThumb = document.getElementById('mini-thumb');
            
            if(isPlaying) {
                playerImg.classList.add('playing-shadow');
                miniThumb.classList.add('playing-shadow');
            } else {
                playerImg.classList.remove('playing-shadow');
                miniThumb.classList.remove('playing-shadow');
            }

            renderSongList();
        }

        function changeVolume(val) {
            initAudio();
            synth.volume.value = Tone.gainToDb(parseFloat(val));
            const icon = document.getElementById('volume-icon');
            if (parseFloat(val) === 0) {
                icon.className = "fas fa-volume-mute text-[#8b9bb4]";
            } else if (parseFloat(val) < 0.4) {
                icon.className = "fas fa-volume-down text-[#8b9bb4]";
            } else {
                icon.className = "fas fa-volume-up text-[#8b9bb4]";
            }
        }

        function toggleMute() {
            const slider = document.getElementById('volume-slider');
            if (parseFloat(slider.value) > 0) {
                previousVolume = slider.value;
                slider.value = 0;
                changeVolume(0);
            } else {
                slider.value = previousVolume;
                changeVolume(previousVolume);
            }
        }
    </script>
</body>
</html>
